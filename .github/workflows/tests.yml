{
  "name": "Analytics quality",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "analytics-ci-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  "jobs": {
    "linux": {
      "name": "Linux preflight and regression",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "outputs": {
        "run_full_tests": "${{ steps.scope.outputs.run_full_tests }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Validate controls and classify the exact diff",
          "id": "scope",
          "env": {
            "BASE_SHA": "${{ github.event.pull_request.base.sha || github.event.before }}",
            "HEAD_SHA": "${{ github.event.pull_request.head.sha || github.sha }}"
          },
          "run": "python tools/guardrails.py ci"
        },
        {
          "name": "Guardrail regressions",
          "run": "python -m unittest discover -s tests -p test_guardrails.py -v"
        },
        {
          "name": "Full synthetic regression suite",
          "if": "${{ steps.scope.outputs.run_full_tests == 'true' }}",
          "run": "python -m unittest discover -s tests -v"
        },
        {
          "name": "Synthetic observation replay",
          "if": "${{ steps.scope.outputs.run_full_tests == 'true' }}",
          "run": "python -m analytics_lab --input examples/person_down.jsonl --source-id synthetic-camera --session-id ci-fixture"
        },
        {
          "name": "Bounded real-video CPU evidence",
          "if": "${{ steps.scope.outputs.run_full_tests == 'true' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'evidence/') }}",
          "env": {
            "PIP_DISABLE_PIP_VERSION_CHECK": "1"
          },
          "run": "set -euo pipefail\npython -m pip install --no-cache-dir 'openvino==2026.3.1' 'opencv-python-headless==4.12.0.88' 'scipy==1.17.1'\npython - <<'PY'\nimport cv2, numpy, openvino, scipy\nprint('runtime_versions=' + ','.join([openvino.__version__, cv2.__version__, numpy.__version__, scipy.__version__]))\nPY\npython -m analytics_lab.validation_seed --output-dir \"$RUNNER_TEMP/analytics-validation\"\npython -m analytics_lab.validation_cli --manifest \"$RUNNER_TEMP/analytics-validation/validation-manifest.json\"\npython -m analytics_lab.detector_diagnostics --manifest \"$RUNNER_TEMP/analytics-validation/validation-manifest.json\"\npython -m analytics_lab.detector_thresholds --manifest \"$RUNNER_TEMP/analytics-validation/validation-manifest.json\" --candidate-dir \"$RUNNER_TEMP/analytics-detectors\"\npython -m analytics_lab.pose_diagnostics --manifest \"$RUNNER_TEMP/analytics-validation/validation-manifest.json\" --candidate-dir \"$RUNNER_TEMP/analytics-detectors\"\npython -m analytics_lab.openpose_diagnostics_v2 --manifest \"$RUNNER_TEMP/analytics-validation/validation-manifest.json\" --candidate-dir \"$RUNNER_TEMP/analytics-detectors\"\npython -m analytics_lab.person_down_e2e_diagnostics --manifest \"$RUNNER_TEMP/analytics-validation/validation-manifest.json\" --candidate-dir \"$RUNNER_TEMP/analytics-detectors\"\npython -m analytics_lab.person_down_pose_ab --manifest \"$RUNNER_TEMP/analytics-validation/validation-manifest.json\" --candidate-dir \"$RUNNER_TEMP/analytics-detectors\"\n"
        }
      ]
    },
    "windows": {
      "name": "Windows regression",
      "needs": "linux",
      "if": "${{ needs.linux.outputs.run_full_tests == 'true' }}",
      "runs-on": "windows-2022",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Full synthetic regression suite",
          "run": "python -m unittest discover -s tests -v"
        },
        {
          "name": "Synthetic observation replay",
          "run": "python -m analytics_lab --input examples/person_down.jsonl --source-id synthetic-camera --session-id ci-fixture"
        }
      ]
    },
    "quality-gate": {
      "name": "Analytics quality gate",
      "needs": [
        "linux",
        "windows"
      ],
      "if": "${{ always() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 1,
      "steps": [
        {
          "name": "Require all applicable checks",
          "env": {
            "LINUX_RESULT": "${{ needs.linux.result }}",
            "WINDOWS_RESULT": "${{ needs.windows.result }}",
            "FULL_TESTS": "${{ needs.linux.outputs.run_full_tests }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\n[[ \"$LINUX_RESULT\" == \"success\" ]]\ncase \"$FULL_TESTS\" in\n  true) [[ \"$WINDOWS_RESULT\" == \"success\" ]] ;;\n  false) [[ \"$WINDOWS_RESULT\" == \"skipped\" ]] ;;\n  *) exit 1 ;;\nesac\n"
        }
      ]
    }
  }
}

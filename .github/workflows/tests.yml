name: Temporal baseline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: temporal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, checked 2026-09-14
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, checked 2026-09-14
        with:
          python-version: '3.11'
      - name: Regression tests (synthetic observations, not accuracy benchmarks)
        run: python -m unittest discover -s tests -v
      - name: Observation replay smoke test
        run: python -m analytics_lab --input examples/person_down.jsonl --source-id synthetic-camera --session-id ci-fixture
